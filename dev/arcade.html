<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade harness</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { overflow: hidden; background: #000; }
  .ah-bar { height: 80px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #1d2028; font-size: 16px; color: var(--ink-2); background: #000; }
  .ah-bar b { font-family: var(--font-display); color: #fff; font-size: 20px; margin-right: 10px; }
  .ah-bar a { color: var(--ink-2); text-decoration: none; padding: 8px 14px; border-radius: 12px; border: 2px solid #3a3f4d; background: #23262f; font-weight: 600; }
  .ah-bar a.on { color: #1d1600; background: #ffcc33; border-color: #ffcc33; }
  .ah-host { position: relative; height: calc(100vh - 80px); max-height: 720px; }
  body.bare .ah-bar { display: none; }
  body.bare .ah-host { height: 100vh; max-height: none; }
</style>
</head>
<body>
<div class="ah-bar"><b>Arcade harness</b><span id="links"></span><span id="st" style="margin-left:auto"></span></div>
<div class="ah-host" id="host"></div>
<script type="module">
  // Usage: dev/arcade.html?game=asteroids&level=2[&debug][&warp=8][&bare]
  //   debug exposes window.__arc; warp fast-forwards canvas games; bare hides this bar so the game fills the
  //   window like the in-app host (#/arcade/<id>). Mounts one arcade game with a stub ctx that logs to the console.
  const p = new URLSearchParams(location.search);
  const game = p.get('game') || 'asteroids';
  const level = Math.max(1, Math.min(3, +(p.get('level') || 1)));
  if (p.has('bare')) document.body.classList.add('bare');
  const GAMES = ['crush', 'drop', 'asteroids', 'tiledock', 'landing', 'shoprun'];
  document.getElementById('links').innerHTML = GAMES.map(g => `<a href="?game=${g}&level=${level}" class="${g === game ? 'on' : ''}">${g}</a>`).join(' ');
  window.addEventListener('error', e => console.error('ARCADE ERROR:', e.message, e.filename, e.lineno));
  window.addEventListener('unhandledrejection', e => console.error('ARCADE REJECTION:', e.reason && (e.reason.stack || e.reason)));
  const key = k => `arc.${game}.${k}`;
  const ctx = {
    level,
    debug: p.has('debug'),
    crew: { commander: 'Finn', engineer: 'Dad' },
    sfx: n => console.log('SFX', n),
    say: t => console.log('SAY', t),
    save: (k, v) => { try { localStorage.setItem(key(k), JSON.stringify(v)); } catch (e) { /* ignore */ } console.log('SAVE', k, JSON.stringify(v)); },
    load: k => { try { const v = localStorage.getItem(key(k)); return v === null ? null : JSON.parse(v); } catch (e) { return null; } },
    recordFact: (k, ok) => console.log('FACT', k, ok),
    onExit: () => console.log('EXIT'),
  };
  window.__ctx = ctx;
  try {
    const mod = await import(`../js/arcade/${game}.js`);
    const host = document.getElementById('host');
    window.__game = mod.mount(host, ctx);
    window.__mod = mod;
    document.getElementById('st').textContent = `${mod.meta.title} · level ${level}`;
    if (p.has('warp') && window.__arc && window.__arc.warp) window.__arc.warp(+p.get('warp') || 6);
    console.log('ARCADE READY', mod.meta.id, JSON.stringify(mod.meta));
  } catch (e) { console.error('ARCADE MOUNT FAILED', e.stack || e); }
</script>
</body>
</html>
